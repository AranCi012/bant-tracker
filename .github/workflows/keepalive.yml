# Tiene sveglio il progetto Supabase (il piano Free va in pausa dopo 7 giorni senza attività).
# Ogni 3 giorni fa una piccola query al database. Non serve nessun segreto: la chiave è
# quella pubblica già presente in config.js, e senza codice di gruppo non legge alcun dato.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 8 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ping Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js)
          status=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$URL/rest/v1/rpc/check_group_key" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status: $(cat /tmp/out)"
          test "$status" = "200"

      # GitHub disattiva i job programmati se il repo non ha commit da 60 giorni:
      # quando l'ultimo commit ha più di 50 giorni ne fa uno vuoto.
      - name: Keep workflow enabled
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
