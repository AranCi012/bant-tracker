<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bant Meta Tracker</title>
  <meta name="description" content="Statistiche dei matchup del nostro Bant Legacy">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232a78d6'/><path d='M10 17l4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <i style="background:var(--mana-w)"></i><i style="background:var(--mana-u)"></i><i style="background:var(--mana-g)"></i>
      </span>
      <span id="app-name">Bant Meta Tracker</span>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sezioni">
      <a href="#dashboard" data-view="dashboard">Dashboard</a>
      <a href="#matchup" data-view="matchup">Matchup</a>
      <a href="#history" data-view="history">Storico</a>
      <a href="#deck" data-view="deck">La nostra lista</a>
      <a href="#opponents" data-view="opponents">Avversari</a>
    </nav>
    <div class="who" id="who"></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main id="view" class="view" aria-live="polite"></main>

  <a href="#add" class="fab" id="fab" aria-label="Registra partita"><span>+</span> Partita</a>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-x" data-close aria-label="Chiudi">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
